fragment_definitions:
- name: MediaPlaybackFields
  source: https://builds.mlbstatic.com/mlb.com/sections/video/builds/3f19968e7502c244bf346238f2fbab4907a655a0_1788358291/scripts/build/index.bundle.js
  source_character_offset: 2597140
  document: |
    fragment MediaPlaybackFields on MediaPlayback {
        id
        slug
        title
        blurb
        description
        date
        canAddToReel
        feeds {
            type
            duration
            closedCaptions
            playbacks {
                name
                url
                mimetype
                segments @include(if: $withPlaybacksSegments)
            }
            image {
                altText
                templateUrl
                cuts {
                    aspectRatio
                    width
                    height
                    src
                }
            }
        }
        keywordsDisplay {
            slug
            displayName
        }
        isInReel @client
        translationId
        playInfo {
            isSinglePlay
            balls
            strikes
            outs
            inning
            inningHalf
            pitchSpeed
            pitchType
            exitVelocity
            hitDistance
            launchAngle
            spinRate
            scoreDifferential
            gamePk
            runners {
                first
                second
                third
            }
            teams {
                away {
                    name
                    shortName
                    triCode
                }
                home {
                    name
                    shortName
                    triCode
                }
                batting {
                    name
                    shortName
                    triCode
                }
                pitching {
                    name
                    shortName
                    triCode
                }
            }
            players {
                pitcher {
                    id
                    name
                    lastName
                    playerHand
                }
                batter {
                    id
                    name
                    lastName
                    playerHand
                }
            }
        }
    }
  classification: source-defined GraphQL fragment; not a request by itself
  transport_note: Remove the local isInReel @client selection before server transport.
