  - getGamesByGamePks[].content.videoContent[].playbacks (alias of playbackScenarios)
  - getGamesByGamePks[].content.recapArticle
  - getGamesByGamePks[].content.relatedArticles
  access: public data for tested POST query
  notes: Source persisted query hash e12a5c2692406844d5f15f52ce7754208f53da81867de7d3e9e773611f4a040a; accepted
    GET transport not established. Source locale map uses EN_US/ES_US/JA_JP; contentSource map uses MLB/MILB.
  document: |
    query getGamesByGamePks(
      $gamePks: [Int]
      $locale: Language
      $gameRecapTags: [String]!
      $relatedArticleTags: [String]!
      $contentSource: ContentSource
    ) {
      getGamesByGamePks(gamePks: $gamePks) {
        gamePk
        gameDate
        content {
          videoContent(locale: $locale, contentSource: $contentSource) {
            headline
            duration
            title
            accessibilityText
            description
            slug
            id: slug
            blurb
            guid: playGuid
            playIdRef
            date: contentDate
            contentDate
            preferredPlaybackScenarioURL(preferredPlaybacks: ["hlsCloud", "mp4Avc"])
            playbacks: playbackScenarios {
              name: playback
              url: location
            }
            thumbnail {
              templateUrl
            }
            tags {
              ...mediaTags
            }
          }
          ... on GameContent {
            recapArticle: articleContent(locale: $locale, tags: $gameRecapTags, limit: 1, contentSource: $contentSource) {
              ...articleFields
            }
            relatedArticles: articleContent(locale: $locale, tags: $relatedArticleTags, excludeTags: $gameRecapTags, contentSource: $contentSource limit: 5) {
              ...articleFields
            }
          }
        }
      }
    }

    fragment mediaTags on Tag {
      ... on GameTag {
        slug
        type
        title
        gamePk
      }
      ... on TaxonomyTag {
        slug
        type
        title
      }
      ... on InternalTag {
        slug
        type
        title
      }
      ... on TeamTag {
        type
        team {
          id
        }
      }
    }

    fragment articleFields on Article {
      contentDate
      description
      headline
      slug
      blurb: summary
      templateUrl: thumbnail
      type
      tags {
        ...mediaTags
      }
    }
  required_fragments:
