api:
  name: MLB Stats API
  base_url: https://statsapi.mlb.com/api/v1
  version: v1; v1.1 for live feed, timestamps and diffPatch
  format: JSON
  auth: Endpoint-specific; verified public routes need no credentials. Play analytics probe required login.
  catalog_status: Inherited entries are not all verified; see per-entry verification and statsapi_route_inventory.yaml.
endpoints:
  sport:
    name: sports
    path: /sports
    description: All sports tracked by the Stats API
    params: {}
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/sports
  sport_by_id:
    name: sport_by_id
    path: /sports/{sportId}
    description: Single sport (sportId=1 is MLB)
    params:
      sportId:
        type: integer
        required: true
        example: 1
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/sports/{sportId}
  leagues:
    name: leagues
    path: /leagues
    description: All leagues (AL=103, NL=104)
    params: {}
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/leagues
  seasons:
    name: seasons
    path: /seasons
    description: Season information
    params:
      sportId:
        type: integer
        example: 1
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/seasons
  team_list:
    name: team_list
    path: /teams
    description: All teams with venue/league info
    params:
      sportId: 1 (MLB)
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams
  team_info:
    name: team_info
    path: /teams/{teamId}
    description: Single team info
    params:
      teamId:
        type: integer
        required: true
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}
  team_roster:
    name: team_roster
    path: /teams/{teamId}/roster
    description: Team roster (active / 40Man / fullRoster / allTime)
    params:
      teamId:
        type: integer
        required: true
      rosterType:
        options:
        - active
        - 40Man
        - fullRoster
        - allTime
        - nonRosterInvitees
        - coaches
        default: active
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}/roster
  team_personnel:
    name: team_personnel
    path: /teams/{teamId}/personnel
    description: Coaching staff
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}/personnel
  team_leaders:
    name: team_leaders
    path: /teams/{teamId}/leaders
    description: Team statistical leaders
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}/leaders
  team_statistics:
    name: team_statistics
    path: /teams/{teamId}/stats
    description: Team stats (aggregated)
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}/stats
  team_affiliates:
    name: team_affiliates
    path: /teams/{teamId}/affiliates
    description: Minor league affiliates
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}/affiliates
  team_alumni:
    name: team_alumni
    path: /teams/{teamId}/alumni
    description: Former players for a team
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/teams/{teamId}/alumni
  schedule:
    name: schedule
    path: /schedule
    description: Game schedule by date/date-range/team
    params:
      sportId: 1 (MLB)
      season: '2025'
      gameType:
        options:
        - R
        - S
        - A
        - D
        - F
        - L
        - W
      startDate: YYYY-MM-DD
      endDate: YYYY-MM-DD
      teamId: team to filter
      hydrate: team,venue,probablePitcher,linescore
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/schedule
  schedule_games:
    name: schedule_games
    path: /schedule/games
    description: Games for a date (lighter response)
    specification:
      documented: false
      inventory: statsapi_route_inventory.yaml
      note: Not present in captured specification; inherited lead, not a confirmed current operation.
  schedule_postseason:
    name: schedule_postseason
    path: /schedule/postseason
    description: Postseason schedule/bracket
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/schedule/postseason
  schedule_postseason_series:
    name: schedule_postseason_series
    path: /schedule/postseason/series
    description: Postseason series breakdown
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/schedule/postseason/series
  standings:
    name: standings
    path: /standings
    description: Division standings
    params:
      leagueId: 103 (AL) or 104 (NL), comma-delimited
      season: '2025'
      standingsTypes:
        options:
        - regularSeason
        - springTraining
        - firstHalf
        - secondHalf
        - playoffs
      date: YYYY-MM-DD (standings as of a date)
      hydrate: team,league,division
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/standings
  people_search:
    name: people_search
    path: /people/search
    description: Search players by name (returns player IDs)
    params:
      names: full name e.g. 'Aaron Judge'
      sportId: 1 (MLB)
      active: true/false
    usage: Resolve player name → MLBAM player ID → query Baseball Savant
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/people/search
  people:
    name: people
    path: /people/{personId}
    description: Player profile (bio, height, weight, draft info)
    params:
      personId:
        type: integer
        required: true
      hydrate: currentTeam,stats,team
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/people/{personId}
  people_stats:
    name: people_stats
    path: /people/{personId}/stats
    description: Player stats (seasonal, career, splits)
    params:
      personId:
        type: integer
        required: true
      stats: season, career, gameLog (stat type)
      group: hitting, pitching, fielding (stat group)
      season: Season year
    verification:
      checked_on: '2026-11-09'
      http_status: 200
      response_type: JSON
      evidence: statsapi_route_inventory.yaml
      probe: people_stats
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/people/{personId}/stats
  people_current_game_stats:
    name: people_current_game_stats
    path: /people/{personId}/currentGameStats
    description: Live game stats for a player
    specification:
      documented: false
      inventory: statsapi_route_inventory.yaml
      note: Not present in captured specification; inherited lead, not a confirmed current operation.
  people_game_log:
    name: people_game_log
    path: /people/{personId}/gameLog
    description: Player game log (per-game results)
    params:
      personId:
        type: integer
        required: true
      group: hitting, pitching, fielding
      season: '2025'
    verification:
      checked_on: '2026-11-09'
      http_status: 404
      response_type: JSON error served as text/plain
      evidence: statsapi_route_inventory.yaml
      probe: people_gamelog
    status: Not found for tested request; use /people/{personId}/stats with stats=gameLog&group=hitting.
    specification:
      documented: false
      inventory: statsapi_route_inventory.yaml
      note: Not present in captured specification; inherited lead, not a confirmed current operation.
  game_live_feed:
    name: game_live_feed
    path: /game/{gamePk}/feed/live
    description: Full live game feed (play-by-play, boxscore, linescore)
    version: v1.1
    params:
      gamePk:
        type: integer
        required: true
      timecode: Optional historical snapshot timecode; obtain values from timestamps.
    verification:
      checked_on: '2026-11-09'
      http_status: 200
      response_type: JSON
      evidence: statsapi_route_inventory.yaml
      probe: feed
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1.1/game/{game_pk}/feed/live
  game_boxscore:
    name: game_boxscore
    path: /game/{gamePk}/boxscore
    description: Box score for a game
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/game/{game_pk}/boxscore
  game_linescore:
    name: game_linescore
    path: /game/{gamePk}/linescore
    description: Linescore only (count, bases, pitchers)
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/game/{game_pk}/linescore
  game_play_by_play:
    name: game_play_by_play
    path: /game/{gamePk}/playByPlay
    description: Play-by-play events
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/game/{game_pk}/playByPlay
  game_win_probability:
    name: game_win_probability
    path: /game/{gamePk}/winProbability
    description: Win probability by play
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/game/{gamePk}/winProbability
  game_decisions:
    name: game_decisions
    path: /game/{gamePk}/decisions
    description: Winning/losing/saving pitcher decisions
    verification:
      checked_on: '2026-11-09'
      http_status: 404
      response_type: JSON error served as text/plain
      evidence: statsapi_route_inventory.yaml
      probe: decisions
    status: Not found for tested request; decisions are available under liveData.decisions in the v1.1 feed.
    specification:
      documented: false
      inventory: statsapi_route_inventory.yaml
      note: Not present in captured specification; inherited lead, not a confirmed current operation.
  game_content:
    name: game_content
    path: /game/{gamePk}/content
    description: Game media content (highlights, editorial)
    verification:
      checked_on: '2026-11-09'
      http_status: 200
      response_type: JSON
      evidence: statsapi_route_inventory.yaml
      probe: content
    response_fields:
    - highlights.highlights.items[].id
    - highlights.highlights.items[].keywordsAll
    - highlights.highlights.items[].playbacks[].name
    - highlights.highlights.items[].playbacks[].url
    notes: Editorial clips can have slug IDs; content does not guarantee every pitch or camera angle.
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/game/{game_pk}/content
  game_status:
    name: game_status
    path: /gameStatus
    description: Catalog of game status codes
    see_docs: statsapi_game_status.yaml
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/gameStatus
  venues:
    name: venues
    path: /venues
    description: All ballparks with location and field info
    params:
      season: '2025'
      hydrate: location,fieldInfo
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/venues
  venue_by_id:
    name: venue_by_id
    path: /venues/{venueId}
    description: Single ballpark
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/venues/{venueId}
  stats:
    name: stats
    path: /stats
    description: Aggregated stats (cross-team, cross-player)
    params:
      group: hitting, pitching, fielding
      stats: season, career
      season: '2025'
      limit: '50'
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/stats
  stats_leaders:
    name: stats_leaders
    path: /stats/leaders
    description: Statistical leaders (leaderboard)
    params:
      leaderCategories: homeRuns, battingAverage, earnedRunAvg, wins
      season: '2025'
      leaderGameTypes: R
      limit: '10'
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/stats/leaders
  stats_streaks:
    name: stats_streaks
    path: /streaks
    description: Active statistical streaks
    previous_path: /stats/streaks
    correction_source: statsapi_openapi.json
    verification_note: Corrected to published specification path; check statsapi_route_inventory.yaml for live probe
      status.
    specification:
      documented: true
      inventory: statsapi_route_inventory.yaml
      path: /api/v1/streaks
  draft:
