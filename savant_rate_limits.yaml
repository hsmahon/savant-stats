# Request limits and retrieval guidance for Baseball Savant and the MLB Stats API.
# Reviewed 2026-11-09 against current first-party documentation.

reviewed: "2026-11-09"

baseball_savant:
  statcast_search_csv:
    official_documentation:
      url: "https://baseballsavant.mlb.com/csv-docs"
      documents: "CSV field definitions and data meanings; no request-rate or response-row cap is stated."
    limits:
      requests_per_second: "not published in the reviewed first-party docs"
      rows_per_response: "not published in the reviewed first-party docs"
      timeout: "not published in the reviewed first-party docs"
    this_repository_observations:
      request_rate_limit_tested: false
      maximum_response_rows_tested: false
      date: "2026-11-09"
    guidance:
      - "Use date/player/team filters to keep requests bounded and make results easier to verify."
      - "If a response appears incomplete or a request fails, narrow the query and compare the resulting partitions; do not assume a particular cap or error cause."
      - "Cache repeated results and avoid unnecessary parallel or burst requests. These are conservative client practices, not MLB-published limits."

  historical_community_reports:
    status: "Not treated as current platform limits or validated by this repository."
    notes:
      - "Older third-party libraries and articles report different CSV row caps (commonly 25,000, 30,000, or about 40,000) and different date chunk sizes. These reports conflict and may describe different dates or queries."
      - "Do not infer truncation solely because a response has a particular row count; compare filtered partitions or verify against an independent count."

mlb_stats_api:
  official_documentation:
    url: "https://docs.statsapi.mlb.com/getting-started/rate-limiting"
    checked: "2026-11-09"
    stated_policy:
      requests_per_second: 25
      window: "per second"
      over_limit_status: 429
      details: "Only requests exceeding the rate return 429. The documented limit is evaluated per second; later seconds allow requests again. The page does not specify a client-specific quota or a separate endpoint-family allowance."
  repository_observations:
    coverage: "Selected read-only routes and bounded requests; not a rate-limit stress test."
    tested_requests_per_second: false
    date: "2026-11-09"
  guidance:
    - "Keep request bursts at or below the documented 25-per-second limit."
    - "If HTTP 429 is returned, reduce the request rate before retrying."
    - "Do not interpret 401, 403, 500, 503, or 504 as rate-limit signals without response-specific evidence."

scope:
  - "The Savant and Stats API limits are separate; the Stats API's documented limit must not be attributed to Baseball Savant."
  - "This file records published policy and bounded observations, not guarantees of availability, completeness, or commercial-use rights."

sources:
  - name: "Baseball Savant Statcast Search CSV documentation"
    url: "https://baseballsavant.mlb.com/csv-docs"
    supports: "CSV field definitions; no rate or row cap identified in the reviewed document."
  - name: "MLB Stats API Rate Limiting documentation"
    url: "https://docs.statsapi.mlb.com/getting-started/rate-limiting"
    supports: "25 requests per second and HTTP 429 behavior for excess requests."
