common_params:
  hydrate:
    description: Embed sub-resources (team, league, venue, stats)
    example: hydrate=team,venue,probablePitcher
  fields:
    description: Comma-delimited list of fields to return (topLevelNode, childNode, attribute)
    example: fields=dates,date,teams
notes:
- Per-entry version overrides api.base_url version.
- Use /schedule for gamePk and the live feed playEvents for playId.
- An HTTP 200 may contain HTML login or a full-feed fallback; inspect content type and payload.
- No completeness or official support guarantee is implied by anonymous access.
- See /standings in main list
- See /streaks
