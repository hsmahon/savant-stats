endpoints:
- name: statcast_search_csv
  description: Pitch-level Statcast data with 200+ filter parameters. Returns CSV.
  url: https://baseballsavant.mlb.com/statcast_search/csv
  method: GET
  format: CSV
  rate_limit: No official figure established; historical reports vary. See savant_rate_limits.yaml.
  timeout: No platform timeout documented; clients should select a timeout appropriate to query size.
  common_params:
  - hfPT
  - hfAB
  - hfGT
  - hfPR
  - hfZ
  - stadium
  - hfBBT
  - hfBBL
  - hfNewZones
  - hfPull
  - hfC
  - hfSea
  - hfSit
  - player_type
  - hfOuts
  - opponent
  - pitcher_throws
  - batter_stands
  - hfSA
  - game_date_gt
  - game_date_lt
  - team
  - position
  - hfRO
  - home_road
  - hfFlag
  - metric_1
  - hfInn
  - min_pitches
  - min_results
  - group_by
  - sort_col
  - player_event_sort
  - sort_order
  - min_pas
  - chk_stats_pa
  - chk_stats_woba
  - chk_stats_xwoba
  stat_checkboxes:
    description: 86+ chk_stats_* parameters to include specific columns in output
    prefix: chk_stats_
    examples:
    - chk_stats_pa
    - chk_stats_woba
    - chk_stats_xwoba
    - chk_stats_ba
    - chk_stats_slg
    - chk_stats_iso
    - chk_stats_babip
    - chk_stats_obp
    - chk_stats_hrs
    - chk_stats_bb
    - chk_stats_so
    - chk_stats_k_percent
    - chk_stats_bb_percent
    - chk_stats_barrels_per_bbe_percent
    - chk_stats_barrels_per_pa_percent
    - chk_stats_hardhit_percent
    - chk_stats_launch_speed
    - chk_stats_launch_angle
    - chk_stats_spin_rate
    - chk_stats_release_extension
    - chk_stats_release_speed
    - chk_stats_effective_speed
    - chk_stats_sweetspot_speed_mph
    - chk_stats_swing_length
    - chk_stats_attack_angle
    - chk_stats_attack_direction
    - chk_stats_swing_path_tilt
    - chk_stats_intercept_ball_minus_batter_pos_x_inches
    - chk_stats_intercept_ball_minus_batter_pos_y_inches
    - chk_stats_rate_ideal_attack_angle
    - chk_stats_bat_speed
    - chk_stats_swing_miss_percent
    - chk_stats_whiffs
    - chk_stats_swings
    - chk_stats_takes
  group_by_options:
  - name
  - name-date
  - name-month
  - name-month-year
  - name-year
  sort_col_options:
  - pitches
  - pitch_percent
  - ba
  - xba
  - xbadiff
  - xwoba
  - woba
  - slg
  - launch_speed
  - launch_angle
  - spin_rate
  - release_extension
  - effective_speed
  player_type_options:
  - batter
  - pitcher
  - fielder_2
  - fielder_3
  - fielder_4
  game_type_options:
  - R
  - PO
  - F
  - D
  - L
  - W
  - S
  - E
  - A
  parameter_note: Existing parameter list is a reference, not a verified minimal required set. Results depend on
    query mode.
- name: leaderboard
  description: Statcast leaderboard pages; CSV export and parameters vary by board and must be verified.
  base_url: https://baseballsavant.mlb.com/leaderboard/{type}
  method: GET
  format: CSV (with ?csv=true) or HTML
  rate_limit: No documented limit
  common_params:
  - year
  - type
  - team
  - min
  - csv
  see_leaderboards_file: savant_leaderboards.yaml
- name: player_page
  description: Player profile page with embedded JSON data blobs
  url: https://baseballsavant.mlb.com/savant-player/{player_name}-{player_id}
  method: GET
  format: HTML (embedded JSON)
  params:
  - stats:
      description: Stat type to display
      required: false
      options:
      - statcast-r-hitting-mlb
      - statcast-r-pitching-mlb
      - gamelogs-r-hitting-mlb
      - gamelogs-r-pitching-mlb
      - statcast-r-fielding-mlb
      - statcast-r-baserunning-mlb
- name: gamefeed
  description: Game object containing scoreboard, players, boxscore and per-pitch records grouped by pitcher.
  url: https://baseballsavant.mlb.com/gf
  method: GET
  format: JSON
  params:
  - game_pk:
      description: MLB game ID (from statsapi schedule)
      required: true
      type: integer
  verification:
    checked_on: '2026-11-09'
    http_status: 200
    response_type: JSON
    evidence: savant_route_inventory.yaml
    probe: gf
- name: comparison_tool
  description: Player comparison tool (HTML UI, 2026+)
  url: https://baseballsavant.mlb.com/comparison-tool
  method: GET
  format: HTML
- name: visuals
  description: Statcast visualization pages
  base_url: https://baseballsavant.mlb.com/visuals/{type}
  method: GET
  format: HTML
  types:
  - pitch3d
  - batting-stance
  - fielder-positioning-all
  - fielder-positioning
  - pitcher-positioning
  - team-positioning
  - batter-positioning
- name: changelog
  description: Feature changelog
  url: https://baseballsavant.mlb.com/changelog
  method: GET
  format: HTML
- name: metrics_context
  description: Statcast metric definitions and context
  url: https://baseballsavant.mlb.com/statcast-metrics-context
  method: GET
  format: HTML
- name: csv_docs
  description: Official CSV field documentation
  url: https://baseballsavant.mlb.com/csv-docs
  method: GET
  format: HTML
- name: sporty_videos
  url: https://baseballsavant.mlb.com/sporty-videos
  method: GET
  format: HTML with video source
  description: Pitch/play video viewer
  params:
    playId: Play UUID from live feed playEvents
  access: public in tested request
  verification:
    checked_on: '2026-11-09'
    http_status: 200
    response_type: HTML with video source
    evidence: savant_route_inventory.yaml
